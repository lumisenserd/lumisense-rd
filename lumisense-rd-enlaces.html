<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Bienvenido a LumiSense RD. Descubre soluciones tecnológicas innovadoras, prácticas y diseñadas para simplificar tu día a día.">
  <title>LumiSense RD | Bienvenido</title>
  <style>
    :root { --bg:#ffffff; --panel:#ffffff; --green:#5c9f20; --green2:#4f8f19; --text:#17251b; --muted:#667267; --line:#dce5dc; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; padding:24px 16px 32px;
      display:flex; align-items:flex-start; justify-content:center;
      color:var(--text); background:#ffffff;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap { width:100%; max-width:440px; position:relative; }
    .card {
      overflow:hidden; position:relative; border:1px solid #e1e9df;
      border-radius:28px; padding:32px 22px 24px;
      background:#ffffff;
      box-shadow:0 18px 55px rgba(24,54,27,.10);
    }
    .card:before,.card:after { content:""; position:absolute; pointer-events:none; border:1px solid rgba(92,159,32,.07); transform:rotate(-28deg); }
    .card:before { width:290px;height:130px;right:-170px;top:30px; }
    .card:after { width:280px;height:120px;left:-190px;bottom:95px; }
    .content { position:relative; z-index:1; }
    .brand-logo { width:100%; max-width:340px; margin:0 auto 12px; }
    .brand-logo img { display:block; width:100%; height:auto; }
    h1 { margin:0; text-align:center; font-size:30px; letter-spacing:.4px; font-weight:750; }
    h1 span { color:var(--green); }
    .tagline { max-width:280px; margin:11px auto 0; text-align:center; color:#59665b; font-size:14px; line-height:1.6; }
    .handle { text-align:center; margin:12px 0 27px; font-size:12px; letter-spacing:1.6px; text-transform:uppercase; color:var(--green2); }
    .links { display:grid; gap:12px; }
    .link {
      min-height:58px; display:flex; align-items:center; gap:13px; padding:13px 16px;
      border:1px solid var(--line); border-radius:15px; color:var(--text);
      text-decoration:none; background:#ffffff; transition:transform .15s, border-color .15s, background .15s;
    }
    .link:hover,.link:focus-visible { transform:translateY(-1px); border-color:rgba(92,159,32,.65); background:rgba(92,159,32,.06); outline:none; }
    .link.primary { display:flex; background:#3f7f16 !important; background-color:#3f7f16 !important; color:#ffffff !important; border:1px solid #3f7f16 !important; font-weight:700; opacity:1 !important; -webkit-appearance:none; appearance:none; }
    .link.primary .link-title, .link.primary .link-sub, .link.primary .ico, .link.primary .arrow { color:#ffffff !important; opacity:1 !important; }
    .link.primary:hover,.link.primary:focus-visible { background:#356d12 !important; background-color:#356d12 !important; }
    .ico { width:28px; height:28px; display:grid; place-items:center; flex:none; }
    .ico svg { width:24px;height:24px; }
    .link-copy { flex:1; }
    .link-title { display:block; font-size:15px; font-weight:650; }
    .link-sub { display:block; margin-top:3px; font-size:12px; opacity:.72; }
    .arrow { font-size:20px; opacity:.75; }
    .foot { text-align:center; margin:24px 0 0; color:#7b867c; font-size:11px; letter-spacing:1.4px; text-transform:uppercase; }
    .foot span { color:var(--green); }
    @media (max-width:360px) { .card { padding:27px 16px 22px; } h1 { font-size:27px; } }
  </style>
</head>
